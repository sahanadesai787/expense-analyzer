spring.application.name=expense-analyzer
# Settings come from environment variables when hosted online; the defaults below are for your own computer.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/expense_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
# Hosting platforms tell the app which port to use via PORT
server.port=${PORT:8080}
